[project]
name = "django-minimal-rag"
version = "0.1.0"
description = "A minimal RAG layer for Django: chunking, pgvector storage, retrieval and cited LLM answers."
readme = "README.md"
authors = [
    { name = "Olivier Charvoz" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]
typecheck = [
    "django-stubs[compatible-mypy]>=6.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "DJ",
    "C90",  # function complexity
    "N",    # PEP 8 naming
    "SIM",  # simplifications
    "RET",  # return statements
    "ARG",  # unused arguments
    "ERA",  # commented-out code
    "PL",   # pylint, including PLR2004 (magic values)
    "PGH",  # blanket `# noqa` / `# type: ignore` (no error code)
    "RUF100",  # unused `# noqa`
]

[tool.ruff.lint.flake8-unused-arguments]
# `*args` / `**kwargs` that a framework signature requires (signal
# receivers, overridden methods).
ignore-variadic-names = true

[tool.ruff.lint.pylint]
# Magic values: flag strings too, not only numbers (the default allows
# "str" and "bytes").
allow-magic-value-types = []

[tool.ruff.lint.per-file-ignores]
# Literal examples are what tests are made of; pytest fixtures are often
# requested for their side effects only.
"tests/**" = ["PLR2004", "ARG001", "ARG002"]
# RunPython functions must accept (apps, schema_editor), used or not.
"**/migrations/**" = ["ARG001"]
# AppConfig.ready() imports inside the method: at module level, the import
# would run before the app registry is ready.
"**/apps.py" = ["PLC0415"]

[tool.mypy]
files = ["src", "tests"]
# Generated by makemigrations; edited by hand only for the exception AGENTS.md
# describes (the pgvector extension).
exclude = ["/migrations/"]
# The oldest supported Python, whatever interpreter runs mypy.
python_version = "3.11"
strict = true
# A `# type: ignore` must name the error it silences.
enable_error_code = ["ignore-without-code"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
