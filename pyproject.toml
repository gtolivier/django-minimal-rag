[project]
name = "django-minimal-rag"
version = "0.1.0"
description = "A minimal RAG layer for Django: chunking, pgvector storage, retrieval and cited LLM answers."
readme = "README.md"
authors = [
    { name = "Olivier Charvoz" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
